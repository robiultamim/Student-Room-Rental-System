





<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>House Booking</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" />

  <link rel="stylesheet" href="./hs.css" />
</head>

<body>
  <!-- partial:index.partial.html -->
  <div class="wrapper">
    <div class="container">
      <article class="part card-details">
        <h1>Flat Details</h1>
        <form action="" if="cc-form" autocomplete="off">
          <div class="group card-name">
            <label for="name">Number of Flats</label>

            <input type="number" id="name" class="" type="number" maxlength="50" placeholder="Enter Number of Flats" name="No_of_Flats"/>
          </div>
          <div class="group card-name">
            <label for="name">Price Range</label>
            <input type="number" id="name" class="" type="text" maxlength="20" placeholder="Price.... in Tk" name="Price Range"/>
          </div>

          <div class="group card-name">
            <label for="name">House no. & Road No.</label>
            <input type="text" id="name" class="" type="text" maxlength="20"
              placeholder="Enter House No & Road No. of the House" name="House no. & Road No"/>
          </div>

          <div class="group card-name">
            <label for="name">Address</label>
            <input type="text" id="name" class="" type="text" maxlength="20" placeholder="Enter Address" name="Address" />
          </div>

          <div class="group card-name">
            <h1>Flat Description</h1>
            <label for="name">Flat Location</label>
            <input type="number" id="name" class="" type="text" maxlength="20"
              placeholder="Which Floor the Flat is located?" name="Flat Location"/>
          </div>

          <div class="group card-name">
            <label for="name">Number of Rooms</label>
            <input type="text" id="name" class="" type="text" maxlength="20" placeholder="Number of Rooms" name="Number of Rooms" />
          </div>

          <div class="group card-name">
            <label for="name">Washroom</label>
            <input type="text" id="name" class="" type="text" maxlength="20" placeholder="Washroom Tiles or not!?" name="Washroom"/>
          </div>

          <div class="group card-name">
            <label for="name">Balcony</label>
            <input type="text" id="name" class="" type="text" maxlength="20" placeholder="Available or not?" name="Balcony" />
          </div>

          <div class="group card-name">
            <label for="name">Kitchen</label>
            <input type="text" id="name" class="" type="text" maxlength="20" placeholder="Available or not?" name="Kitchen" />
          </div>

          <div class="group card-name">
            <label for="name">Drawing / Dinning room</label>
            <input type="text" id="name" class="" type="text" maxlength="20" placeholder="Available or not?" name="Drawing / Dinning room" />
          </div>

          <div class="group card-name">
            <label for="name">Security (CCTV)</label>
            <input type="text" id="name" class="" type="text" maxlength="20" placeholder="Available or not?"name="Security (CCTV)" />
          </div>

          <div class="group card-name">
            <label for="name">Guard</label>
            <input type="text" id="name" class="" type="text" maxlength="20" placeholder="Available or not?"name="Guard" />
          </div>

          <div class="group card-name">
            <label for="name">Lift</label>
            <input type="text" id="name" class="" type="text" maxlength="20" placeholder="Available or not?" name="Lift" />
          </div>

          <div class="group card-name">
            <label for="name">Service Charge</label>
            <input type="text" id="name" class="" type="text" maxlength="20" placeholder="Amount in Tk" name="Service Charge" />
          </div>

          <div class="modal-footer">
            <button class="btn-primary">Submit</button>
          </div>
        </form>
      </article>

      <div class="part bg">
        <div class="modal">
          <div class="modal-header">
            <div class="modal-logo">
              <span class="logo-circle">
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512"
                  height="419.116" viewBox="0 0 512 419.116">
                  <defs>
                    <clipPath id="clip-folder-new">
                      <rect width="512" height="419.116" />
                    </clipPath>
                  </defs>
                  <g id="folder-new" clip-path="url(#clip-folder-new)">
                    <path id="Union_1" data-name="Union 1"
                      d="M16.991,419.116A16.989,16.989,0,0,1,0,402.125V16.991A16.989,16.989,0,0,1,16.991,0H146.124a17,17,0,0,1,10.342,3.513L227.217,57.77H437.805A16.989,16.989,0,0,1,454.8,74.761v53.244h40.213A16.992,16.992,0,0,1,511.6,148.657L454.966,405.222a17,17,0,0,1-16.6,13.332H410.053v.562ZM63.06,384.573H424.722L473.86,161.988H112.2Z"
                      fill="var(--c-action-primary)" stroke="" stroke-width="1" />
                  </g>
                </svg>
              </span>
            </div>
            <button class="btn-close">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                <path fill="none" d="M0 0h24v24H0V0z" />
                <path
                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"
                  fill="var(--c-text-secondary)" />
              </svg>
            </button>
          </div>
          <div class="modal-body">
            <h2 class="modal-title">Upload Flats Picture</h2>
            <p class="modal-description">Attach the files below</p>
            <button class="upload-area">
              <span class="upload-area-icon">
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="340.531"
                  height="419.116" viewBox="0 0 340.531 419.116">
                  <g id="files-new" clip-path="url(#clip-files-new)">
                    <path id="Union_2" data-name="Union 2"
                      d="M-2904.708-8.885A39.292,39.292,0,0,1-2944-48.177V-388.708A39.292,39.292,0,0,1-2904.708-428h209.558a13.1,13.1,0,0,1,9.3,3.8l78.584,78.584a13.1,13.1,0,0,1,3.8,9.3V-48.177a39.292,39.292,0,0,1-39.292,39.292Zm-13.1-379.823V-48.177a13.1,13.1,0,0,0,13.1,13.1h261.947a13.1,13.1,0,0,0,13.1-13.1V-323.221h-52.39a26.2,26.2,0,0,1-26.194-26.195v-52.39h-196.46A13.1,13.1,0,0,0-2917.805-388.708Zm146.5,241.621a14.269,14.269,0,0,1-7.883-12.758v-19.113h-68.841c-7.869,0-7.87-47.619,0-47.619h68.842v-18.8a14.271,14.271,0,0,1,7.882-12.758,14.239,14.239,0,0,1,14.925,1.354l57.019,42.764c.242.185.328.485.555.671a13.9,13.9,0,0,1,2.751,3.292,14.57,14.57,0,0,1,.984,1.454,14.114,14.114,0,0,1,1.411,5.987,14.006,14.006,0,0,1-1.411,5.973,14.653,14.653,0,0,1-.984,1.468,13.9,13.9,0,0,1-2.751,3.293c-.228.2-.313.485-.555.671l-57.019,42.764a14.26,14.26,0,0,1-8.558,2.847A14.326,14.326,0,0,1-2771.3-147.087Z"
                      transform="translate(2944 428)" fill="var(--c-action-primary)" />
                  </g>
                </svg>
              </span>
              <div class="upload-area" onclick="selectFile()">
                <span class="upload-area-title">Drag file(s) here to upload.</span>
                <span class="upload-area-description">
                  Alternatively, you can select a file by <br />
                  <strong>clicking here</strong>
                </span>
              </div>
            
              <input type="file" id="file-input" name="Pics" multiple onchange="handleFiles(this.files)" hidden />

              <div id="file-info"></div>

              <script>
                function selectFile() {
                  document.getElementById('file-input').click();
                }

                function handleFiles(files) {
                  const fileInfo = document.getElementById('file-info');
                  fileInfo.innerHTML = '';

                  if (files.length > 0) {
                    fileInfo.innerHTML = '<strong>Selected File(s):</strong><br>';
                    for (const file of files) {
                      fileInfo.innerHTML += `- ${file.name}<br>`;
                    }
                  } else {
                    fileInfo.innerHTML = '<strong>No file selected.</strong>';
                  }
                }
              </script>

            </button>
          </div>
          
        </div>
      </div>
    </div>
  </div>
  <!-- partial -->
  <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  <script src="./hs.js"></script>
  <!-- <script src="script.js"></script> -->
</body>

</html>
